seed = 0
function = "bin.modern_nca.main"
n_trials = 100
timeout = "__null__"

[sampler]

[space]
seed = 0
batch_size = 256
patience = 16
n_epochs = inf

[space.data]
seed = 0
cache = true
path = ":data/stroke"
num_policy = "quantile"
cat_policy = "__null__"
y_policy = "__null__"

[space.model]
dim = ["_tune_", "int", 64, 1024]
dropout = ["_tune_", "uniform", 0.0, 0.5]
d_block = ["_tune_", "int", 64, 1024]
n_blocks = ["_tune_", "?int", 0, 0, 2]
temperature = 1.0
sample_rate = ["_tune_", "uniform", 0.05, 0.6]

[space.model.num_embeddings]
type = "PLREmbeddings"
n_frequencies = ["_tune_", "int", 16, 96]
frequency_scale = ["_tune_", "loguniform", 0.005, 10.0]
d_embedding = ["_tune_", "int", 16, 64]
lite = true

[space.optimizer]
type = "AdamW"
lr = ["_tune_", "loguniform", 1e-5, 0.1]
weight_decay = ["_tune_", "?loguniform", 0.0, 1e-6, 1e-3]
