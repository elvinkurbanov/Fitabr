seed = 0
function = "bin.modern_nca.main"
n_trials = 100
timeout = "__null__"

[sampler]

[space]
seed = 0
batch_size = 128
patience = 16
n_epochs = inf

[space.data]
seed = 0
cache = true
path = ":data/stroke"
num_policy = "quantile"
cat_policy = "__null__"
y_policy = "__null__"

[space.model]
num_embeddings = "__null__"
d_embedding = ["_tune_", "int", 64, 256]
d_block = ["_tune_", "int", 128, 512]
n_blocks = ["_tune_", "int", 0, 2]
dropout = ["_tune_", "uniform", 0.0, 0.5]
sample_rate = ["_tune_", "uniform", 0.15, 0.75]
temperature = ["_tune_", "loguniform", 0.03, 1.0]

[space.optimizer]
type = "AdamW"
lr = ["_tune_", "loguniform", 3e-5, 3e-3]
weight_decay = ["_tune_", "?loguniform", 0.0, 1e-6, 1e-3]
